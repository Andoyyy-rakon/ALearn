<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="25%" stop-color="#E2B755"/>
      <stop offset="50%" stop-color="#C59634"/>
      <stop offset="75%" stop-color="#E5C16C"/>
      <stop offset="100%" stop-color="#A87B22"/>
    </linearGradient>

    <linearGradient id="goldTextGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE49C"/>
      <stop offset="35%" stop-color="#E6BC5A"/>
      <stop offset="70%" stop-color="#C99834"/>
      <stop offset="100%" stop-color="#A2731F"/>
    </linearGradient>

    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Golden Frame -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#goldGradient)" />

  <!-- Inner Dark Charcoal Ink Container -->
  <rect x="36" y="36" width="440" height="440" rx="82" fill="#131314" />

  <!-- Centered Serif 'A' Glyph -->
  <g filter="url(#goldGlow)">
    <text 
      x="256" 
      y="350" 
      font-family="Georgia, 'Times New Roman', 'Fraunces', serif" 
      font-size="340" 
      font-weight="700" 
      text-anchor="middle" 
      fill="url(#goldTextGradient)"
      letter-spacing="-4"
    >A</text>
  </g>
</svg>
